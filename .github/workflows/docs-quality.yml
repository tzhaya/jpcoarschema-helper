name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mermaid:
    name: Mermaid syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.15.0
      - name: Render Mermaid blocks in flowchart pages
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/mermaid"
          mkdir -p "$output_dir"
          for input in decision-trees/*.md; do
            output="$output_dir/$(basename "$input")"
            mmdc --input "$input" --output "$output"
          done

  internal-links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --verbose --config lychee.toml '**/*.md'

  external-links:
    name: External links (advisory)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Check external Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --config lychee.toml '**/*.md'
